    if (drawnVals.length) row(keyGlyph("circle", color(drawnVals[0][0])), "Circle:", md.keyCircle);
    const dr = curRows.filter(([a]) => ticked.has(a));
    if (dr.some(([a]) => a !== cur())) row(keyGlyph("dashed", color(dr[0][1][0])), "Dashed arrow:", md.keyDashed);
    if (dr.some(([a]) => a === cur())) row(keyGlyph("loop", css("--ink2")), "Loop:", md.keyLoop);
    if (dr.some(([, v]) => !sig(v))) row(keyGlyph("dashed", color(dr[0][1][0]), true), "Faint dashed arrow:", "its 95% interval includes 0");
  }
  if (anyFaint) row(keyGlyph("circle", color(-1), true), "Faint circle:", "its 95% interval includes 0");
  out.push(`<div class="kr"><span class="kg" style="background:linear-gradient(to right,${[-30, -1, -0.05, 0, 0.05, 1, 30].map(color).join(",")})"></span>` +
           `<div><b>Colour:</b> red = fewer riders, blue = more; darker = larger (scale on the right)</div></div>`);
  row(keyGlyph("zone"), "Black outline:", "the congestion zone");
  document.getElementById("key").innerHTML = `<div class="kt">${cur() === null ? md.keyTitle0 : md.keyTitle}</div>` + out.join("");
}
function bigVal() { return P().R[cur()]; }   // the selected NTA: its change under the whole policy, R(j) or R(i)
function draw() {
  gNodes.replaceChildren(); gSel.replaceChildren(); hideTip();
  const md = M(), p = P(), a0 = cur(), shown = [];
  drawnVals = [];
  curRows = a0 === null ? [] : rows();
  if (a0 === null) {   // every NTA of the pattern, coloured by its change R: A = the treated NTAs, B = all NTAs
    for (const a of (mode === "j" ? TJ : [...Array(N).keys()])) shown.push([a, p.R[a], `<b>${DATA.names[a]}</b><br>${cap(md.keyCircle0)}: ${ci(p.R[a], 3)}%`]);
  } else curRows.forEach(([a, v]) => { if (a !== a0) shown.push([a, v, `<b>${DATA.names[a]}</b><br>${cap(md.keyCircle)}: ${fmt(v[0], 3)}%<br>95% interval ${fmt(v[1], 3)} to ${fmt(v[2], 3)}%`]); });
  drawnVals = shown.map(s => s[1]);
  const rN = DATA.viewbox[2] * 0.0075;   // about 4 px
  shown.sort((x, y) => Math.abs(x[1][0]) - Math.abs(y[1][0])).forEach(([a, v, html]) => circle(a, v, rN, gNodes, html, false));
  if (a0 !== null) {   // the selected NTA, enlarged
    const v = bigVal(), self = curRows.find(([a]) => a === a0);
    const html = `<b>${DATA.names[a0]}</b> (selected)<br>${cap(md.keyBig)}: ${ci(v, 3)}%` +
                 (self ? `<br>${cap(md.keyLoop)}: ${fmt(self[1][0], 3)}%` : "");
    circle(a0, v, rN * 2.1, gSel, html, true);
  }
  drawFlows();
  summary();
  table();
  document.getElementById("howto").innerHTML = MODES[mode].howto;
}
function cap(s) { return s[0].toUpperCase() + s.slice(1); }
function summary() {
  const a = cur(), box = document.getElementById("summary");
  if (a === null) { box.innerHTML = ""; return; }
  const head = `<div class="kv"><b>${DATA.names[a]}</b> (${DATA.boro[a]}), 2024 inflow per weekday: ${DATA.inflow[a].toFixed(0)}</div>`;
  box.innerHTML = head + (mode === "j"
    ? `<div class="kv">Change of NTA j brought by the policy: <b>${ci(bigVal(), 3)}%</b></div>` +
      `<div class="kv">${cap(M().keyC)}: <b>${ci(Cj(TPOS.get(a)))} pts</b></div>`
    : `<div class="kv">Change of NTA i brought by the policy: <b>${ci(bigVal(), 3)}%</b></div>`);
}
function table() {
  document.getElementById("listwrap").style.display = cur() === null ? "none" : "block";
  const tb = document.querySelector("#top tbody"); tb.replaceChildren();
  curRows.forEach(([a, v]) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><input type="checkbox" aria-label="Draw ${DATA.names[a]}"${ticked.has(a) ? " checked" : ""}>` +
      `<span class="swatch" style="background:${color(v[0])}"></span>${DATA.names[a]}</td>` +
      `<td class="num">${fmt(v[0], 3)}%</td><td class="num">${fmt(v[1], 3)} to ${fmt(v[2], 3)}</td>`;
    tr.querySelector("input").onchange = e => { if (e.target.checked) ticked.add(a); else ticked.delete(a); drawFlows(); };
    tb.appendChild(tr);
  });
}
const tbtn = document.getElementById("tickbtns");
[["Tick top 10", () => curRows.slice(0, 10).forEach(([a]) => ticked.add(a))], ["Clear", () => ticked.clear()]]
  .forEach(([lab, fn]) => { const b = document.createElement("button"); b.textContent = lab;
    b.onclick = () => { fn(); drawFlows(); table(); }; tbtn.appendChild(b); });
// selection: clicking an NTA on the map (A: treated NTAs only) selects it, clicking it again or outside the city clears it
function clickNta(a) {
  if (mode === "j" && !isT(a)) return;
  select(cur() === a ? null : a);
}
function select(a) {
  if (cur() === a) return;
  sel[mode] = a; ticked.clear();
  draw();
}
// controls
const pk = document.getElementById("peaks");
PEAKS.forEach(([k, lab]) => { const b = document.createElement("button"); b.textContent = lab; b.setAttribute("aria-pressed", k === peak);
  b.onclick = () => { peak = k; ticked.clear(); [...pk.children].forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); }; pk.appendChild(b); });
function setMode() {   // texts of the current pattern
  const md = M();
  for (const [id, key] of [["mdesc", "desc"], ["toph", "toph"], ["topc", "topc"]])
    document.getElementById(id).textContent = md[key];
  document.getElementById("scopewrap").style.display = mode === "j" ? "block" : "none";
}
const mdiv = document.getElementById("mode");
Object.entries(MODES).forEach(([k, m]) => { const b = document.createElement("button"); b.textContent = m.button;
  b.setAttribute("aria-pressed", k === mode);
  b.onclick = () => { mode = k; ticked.clear(); [...mdiv.children].forEach(x => x.setAttribute("aria-pressed", x === b)); setMode(); draw(); };
  mdiv.appendChild(b); });
const sdiv = document.getElementById("scope");
[["all", "All NTAs"], ["control", "Control NTAs only"]].forEach(([k, lab]) => { const b = document.createElement("button");
  b.textContent = lab; b.setAttribute("aria-pressed", k === scope);
  b.onclick = () => { scope = k; ticked.clear(); [...sdiv.children].forEach(x => x.setAttribute("aria-pressed", x === b)); setMode(); draw(); };
  sdiv.appendChild(b); });
setMode();
// legend
const ticks = [-30, -3, -0.3, -0.03, 0, 0.03, 0.3, 3, 30];
document.getElementById("bar").style.background = "linear-gradient(to right," + Array.from({length: 41}, (_, k) => {
  const s = -1 + 2 * k / 40, fmax = 1 + Math.log10(VMAX / LIN), f = Math.abs(s) * fmax;
  const v = Math.sign(s) * (f <= 1 ? f * LIN : LIN * Math.pow(10, f - 1)); return color(v); }).join(",") + ")";
const tk = document.getElementById("ticks");
tk.style.position = "relative"; tk.style.height = "16px"; tk.style.display = "block";
tk.innerHTML = ticks.map(t => `<span style="position:absolute;left:${((symlog(t) + 1) / 2 * 100).toFixed(2)}%;transform:translateX(-50%)">${t > 0 ? "+" : ""}${t}%</span>`).join("");
draw();
</script>
